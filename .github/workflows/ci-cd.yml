name: Dessert Shop CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Skip Build Step
        run: echo "No build script defined, skipping build step."

      # Optional: Run tests if you have any
      # - name: Run tests
      #   run: npm test

      # Deployment step (optional)
