name: Dessert Shop CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests (optional)
        run: npm test

      - name: Build project (optional if not using TS/Build step)
        run: npm run build

      # Example deployment: Deploy to Render using curl (API key + deploy hook)
      - name: Deploy to Render (example)
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

  
